name: update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: |
          curl -fsSL -o sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.13.0/sing-box-1.13.0-linux-amd64.tar.gz
          tar -xzf sb.tar.gz
          sudo install -m 755 sing-box-1.13.0-linux-amd64/sing-box /usr/local/bin/sing-box

      - name: Build config
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add config.json
          git commit -m "update config" || exit 0
          git push